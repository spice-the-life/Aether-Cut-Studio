name: Build Windows .exe (Version 1.0)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Package Windows .exe Installer
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (Version 1.0)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: 'AetherCut Studio Version 1.0'
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          body: |
            ## AetherCut Studio - Version 1.0 Release
            
            Welcome to the official Windows desktop release of **AetherCut Studio Version 1.0**.

            ### 🚀 Highlights & Features
            - **Apple Final Cut Pro Aesthetic**: Dark titanium interface with authentic traffic lights and central rounded LCD timecode cockpit.
            - **Magnetic & Traditional Track Timeline**: Numbered track lanes with dual-zone clips (filmstrip preview + audio waveform).
            - **Draggable Volume Rubberbands**: Real-time interactive audio level adjustment directly on timeline clips.
            - **Node-Based Compositing & Color Grade**: Full visual node graph pipeline with chroma keying, LUT-style controls, and film grain.
            - **High Performance**: Native 64-bit Windows desktop app with hardware-accelerated WebGL playback.

            ### 💾 Installation (Windows x64)
            1. Download `AetherCut-Studio-Setup-1.0.0.exe` below.
            2. Run the installer and follow the on-screen setup prompts.
            3. Launch **AetherCut Studio** from your Desktop or Start Menu.
          files: |
            release/*.exe
            release/*.exe.blockmap
