name: Build & Release Windows .exe (Version 1.3)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version Tag (e.g. v1.3.0)'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Type-Check Codebase
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Package Windows .exe Installer with Electron Builder
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: 'AetherCut Studio Version 1.3 (Windows .exe)'
          tag_name: ${{ inputs.release_version || github.ref_name || 'v1.3.0' }}
          draft: false
          prerelease: false
          body: |
            ## AetherCut Studio - Version 1.3.0 Official Release

            Welcome to the official desktop release of **AetherCut Studio Version 1.3.0**.

            ### Highlights & Features
            - **AI Voiceover Studio**: Generate spoken audio from custom scripts or `S1` captions with selectable voices, 6 delivery styles, speed/pitch controls, multi-speaker dialogue casts, automatic `A1`/`A2` timeline insertion, `S1` subtitle synchronization, and single-sentence regeneration.
            - **Subtitles & AI Captions Studio (`S1`)**: Integrated `SRT Editor`, `AI Subtitles`, `AI Voiceover`, `Subtitle Styling`, and `Speaker Management` tabs with `.srt` import/export and Gemini audio transcription.
            - **1080p / 4K Export with Audio & Burn-In Subtitles**: Native-resolution rendering muxed with a 48kHz stereo offline audio mixdown and scaled burn-in captions.
            - **Editing Reliability & Workspace Polish**: `.aethercut.json` project save/load with voiceover & media rehydration, IndexedDB autosave, multi-step Undo/Redo across edits and track controls, improved timeline clip/trim/waveform affordances, and persisted panel layouts.
            - **Node-Based Compositing & Color Grade**: Visual node graph pipeline with chroma keying, film grain, blur, and LUT filters.

            ### Windows Installation
            1. Download **`AetherCut-Studio-Setup-1.3.0.exe`** from Assets below.
            2. Run the installer and choose your preferred shortcuts.
            3. Launch **AetherCut Studio** from your Desktop or Start Menu.
          files: |
            release/*.exe
            release/*.exe.blockmap
            Installers/v1.3/AetherCut-Studio-Launcher.bat
            Installers/v1.3/AetherCut-Studio-1.3.0.dmg
            Installers/v1.3/AetherCut-Studio-1.3.0-macOS.app.tar.gz
