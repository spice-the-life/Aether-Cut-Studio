name: Build & Release Windows .exe (Version 1.2)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version Tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Package Windows .exe Installer with Electron Builder
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: 'AetherCut Studio Version 1.2 (Windows .exe)'
          tag_name: ${{ inputs.release_version || github.ref_name || 'v1.2.0' }}
          draft: false
          prerelease: false
          body: |
            ## AetherCut Studio - Version 1.2 Official Windows Release

            Welcome to the official Windows desktop release of **AetherCut Studio Version 1.2**.

            ### 🚀 Highlights & Features
            - **Native 64-bit Windows Executable**: High-performance desktop application with full hardware acceleration.
            - **Apple Final Cut Pro Aesthetic**: Dark titanium interface with traffic lights and central LCD timecode cockpit.
            - **Magnetic & Traditional Track Timeline**: Dual-zone clips with filmstrip preview and high-fidelity audio waveform.
            - **Draggable Volume Rubberbands**: Real-time interactive audio level adjustment directly on timeline clips.
            - **Node-Based Compositing & Color Grade**: Visual node graph pipeline with chroma keying and LUT filters.
            - **Instant Setup Wizard**: Installs cleanly into `Program Files` or `AppData` with Desktop and Start Menu shortcuts.

            ### 💾 Windows Installation
            1. Download **`AetherCut-Studio-Setup-1.2.0.exe`** from Assets below.
            2. Run the installer and choose your preferred shortcuts.
            3. Launch **AetherCut Studio** from your Desktop or Start Menu.
          files: |
            release/*.exe
            release/*.exe.blockmap
            Installers/v1.2/*.exe
            Installers/v1.2/*.bat
            Installers/v1.2/*.dmg
